name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./com.protomothis.spotify-deck-plus.sdPlugin/manifest.json').Version")
          if [ "$tag" != "$pkg" ] || [ "$tag.0" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($pkg) / manifest.json ($manifest)"
            exit 1
          fi

      - run: npm test
      - run: npm run build
      - run: npm run pack

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.streamDeckPlugin --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
