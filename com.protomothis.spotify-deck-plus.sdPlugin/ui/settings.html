<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Spotify Deck+</title>
		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				padding: 8px 12px 16px;
				font:
					12px/1.45 -apple-system,
					"Segoe UI",
					"Apple SD Gothic Neo",
					"Malgun Gothic",
					"Hiragino Sans",
					"Yu Gothic UI",
					sans-serif;
				color: #d8d8d8;
				background: #2d2d2d;
			}
			h3 {
				margin: 14px 0 6px;
				font-size: 12px;
				color: #fff;
			}
			.row {
				display: flex;
				gap: 6px;
				align-items: center;
				margin: 6px 0;
			}
			input,
			select {
				flex: 1;
				min-width: 0;
				background: #3d3d3d;
				color: #fff;
				border: 1px solid #555;
				border-radius: 3px;
				padding: 4px 6px;
				font: inherit;
			}
			button {
				background: #1db954;
				color: #000;
				border: 0;
				border-radius: 3px;
				padding: 5px 10px;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			button.secondary {
				background: #4a4a4a;
				color: #fff;
			}
			button:disabled {
				opacity: 0.5;
			}
			.status {
				padding: 6px 8px;
				border-radius: 3px;
				background: #3a3a3a;
			}
			.ok {
				color: #1ed760;
			}
			.err {
				color: #f15e6c;
			}
			code {
				background: #3d3d3d;
				padding: 1px 4px;
				border-radius: 3px;
				user-select: all;
			}
			ol {
				padding-left: 18px;
				margin: 4px 0;
			}
			[hidden] {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<section id="playlist-section" hidden>
			<h3 data-t="playlist"></h3>
			<div class="row">
				<select id="playlist">
					<option value="" data-t="loading"></option>
				</select>
				<button class="secondary" id="reload" data-t-title="reload">↻</button>
			</div>
		</section>

		<section id="seek-section" hidden>
			<h3 data-t="seekStep"></h3>
			<div class="row"><select id="seekStep" data-setting="seekStep" data-unit="sec"></select></div>
		</section>

		<section id="volume-section" hidden>
			<h3 data-t="volumeStep"></h3>
			<div class="row"><select id="volumeStep" data-setting="volumeStep" data-unit="pct"></select></div>
		</section>

		<h3 data-t="account"></h3>
		<div class="status" id="status" data-t="checking"></div>
		<div class="row">
			<button class="secondary" id="open" data-t="open"></button>
		</div>

		<script>
			const TEXT = {
				en: {
					playlist: "Playlist to add to",
					loading: "Loading…",
					reload: "Reload list",
					choose: "— Choose a playlist —",
					account: "Spotify account",
					checking: "Checking…",
					open: "Open settings page",
					seekStep: "Seek per dial tick",
					volumeStep: "Volume per dial tick",
					sec: "{0} s",
					pct: "{0}%",
					loggedIn: "Logged in as {0}",
					loggedOut: "Not logged in. Log in on the settings page.",
				},
				ko: {
					playlist: "추가할 재생목록",
					loading: "불러오는 중…",
					reload: "목록 새로고침",
					choose: "— 재생목록 선택 —",
					account: "Spotify 계정",
					checking: "확인 중…",
					open: "설정 페이지 열기",
					seekStep: "다이얼 한 칸당 탐색",
					volumeStep: "다이얼 한 칸당 볼륨",
					sec: "{0}초",
					pct: "{0}%",
					loggedIn: "{0} 로그인됨",
					loggedOut: "로그인되어 있지 않습니다. 설정 페이지에서 로그인하세요.",
				},
				ja: {
					playlist: "追加先のプレイリスト",
					loading: "読み込み中…",
					reload: "リストを更新",
					choose: "— プレイリストを選択 —",
					account: "Spotify アカウント",
					checking: "確認中…",
					open: "設定ページを開く",
					seekStep: "ダイヤル1目盛りのシーク",
					volumeStep: "ダイヤル1目盛りの音量",
					sec: "{0}秒",
					pct: "{0}%",
					loggedIn: "{0} でログイン中",
					loggedOut: "ログインしていません。設定ページでログインしてください。",
				},
			};
			let T = TEXT.en;
			const $ = (id) => document.getElementById(id);
			const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
			let ws,
				uuid,
				actionUUID,
				settings = {};

			function applyText(lang) {
				T =
					TEXT[
						String(lang ?? "en")
							.toLowerCase()
							.split(/[-_]/)[0]
					] ?? TEXT.en;
				document.documentElement.lang = lang ?? "en";
				document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[el.dataset.t]));
				document.querySelectorAll("[data-t-title]").forEach((el) => (el.title = T[el.dataset.tTitle]));
			}
			applyText("en");

			function sendToPlugin(payload) {
				ws?.send(JSON.stringify({ event: "sendToPlugin", action: actionUUID, context: uuid, payload }));
			}
			function setSettings(s) {
				settings = s;
				ws?.send(JSON.stringify({ event: "setSettings", context: uuid, payload: s }));
			}
			function setStatus(html, cls = "") {
				$("status").className = "status " + cls;
				$("status").innerHTML = html;
			}

			function renderPlaylists(items) {
				const sel = $("playlist");
				sel.innerHTML = `<option value="">${esc(T.choose)}</option>` + items.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
				sel.value = settings.playlistId ?? "";
				if (settings.playlistId && sel.value !== settings.playlistId) {
					sel.insertAdjacentHTML("beforeend", `<option value="${esc(settings.playlistId)}">${esc(settings.playlistName ?? settings.playlistId)}</option>`);
					sel.value = settings.playlistId;
				}
			}

			function onMessage(msg) {
				switch (msg.event) {
					case "status":
						if (msg.loggedIn) {
							setStatus(`<span class="ok">●</span> ${esc(T.loggedIn.replace("{0}", msg.user))}`);
							if (!$("playlist-section").hidden) sendToPlugin({ event: "playlists" });
						} else {
							setStatus(esc(T.loggedOut));
						}
						break;
					case "playlists":
						renderPlaylists(msg.items);
						break;
					case "error":
						setStatus(esc(msg.message), "err");
						break;
				}
			}

			const STEPS = { seekStep: [[1, 2, 5, 10, 15, 30], 5], volumeStep: [[1, 2, 5, 10], 2] };
			function renderSteps() {
				document.querySelectorAll("[data-setting]").forEach((sel) => {
					const [values, def] = STEPS[sel.dataset.setting];
					const unit = T[sel.dataset.unit];
					sel.innerHTML = values.map((v) => `<option value="${v}">${esc(unit.replace("{0}", v))}</option>`).join("");
					sel.value = String(settings[sel.dataset.setting] ?? def);
					sel.onchange = () => setSettings({ ...settings, [sel.dataset.setting]: Number(sel.value) });
				});
			}

			$("open").onclick = () => sendToPlugin({ event: "openSettings" });
			$("reload").onclick = () => sendToPlugin({ event: "playlists" });
			$("playlist").onchange = (e) => {
				const opt = e.target.selectedOptions[0];
				setSettings({ ...settings, playlistId: opt.value || undefined, playlistName: opt.value ? opt.textContent : undefined });
			};

			// Called by Stream Deck when the property inspector loads.
			window.connectElgatoStreamDeckSocket = (port, inUUID, registerEvent, info, actionInfo) => {
				uuid = inUUID;
				try {
					applyText(JSON.parse(info).application?.language);
				} catch {}
				const action = JSON.parse(actionInfo);
				actionUUID = action.action;
				settings = action.payload?.settings ?? {};
				$("playlist-section").hidden = actionUUID !== "com.protomothis.spotify-deck-plus.add-to-playlist";
				$("seek-section").hidden = actionUUID !== "com.protomothis.spotify-deck-plus.playback-dial";
				$("volume-section").hidden = actionUUID !== "com.protomothis.spotify-deck-plus.volume-dial";
				renderSteps();

				ws = new WebSocket("ws://127.0.0.1:" + port);
				ws.onopen = () => {
					ws.send(JSON.stringify({ event: registerEvent, uuid }));
					sendToPlugin({ event: "status" });
				};
				ws.onmessage = (e) => {
					const data = JSON.parse(e.data);
					if (data.event === "sendToPropertyInspector") onMessage(data.payload);
					if (data.event === "didReceiveSettings") settings = data.payload.settings ?? {};
				};
			};
		</script>
	</body>
</html>
